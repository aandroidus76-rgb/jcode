name: Arch Linux Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: archlinux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JCODE_CI: "1"
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build on Arch Linux (x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel ca-certificates cmake git pkgconf rust shadow

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Prepare unprivileged package builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Report Arch and Rust versions
        run: |
          cat /etc/os-release
          rustc --version
          cargo --version

      - name: Build Arch package
        working-directory: packaging/arch
        run: |
          runuser -u builder -- env \
            HOME=/home/builder \
            CARGO_HOME=/home/builder/.cargo \
            CARGO_BUILD_RUSTC_WRAPPER="" \
            CARGO_BUILD_JOBS=3 \
            makepkg --nodeps --noconfirm --cleanbuild

      - name: Install and verify Arch package
        run: |
          set -eu
          package="$(find packaging/arch -maxdepth 1 -name 'jcode-*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          pacman -U --noconfirm "$package"
          jcode --no-update --no-selfdev --version

      - uses: actions/upload-artifact@v4
        with:
          name: jcode-archlinux-x86_64
          path: packaging/arch/jcode-*.pkg.tar.zst
          if-no-files-found: error
